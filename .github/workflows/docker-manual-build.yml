on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'the dashboard commit sha (or ref)'
        required: true

name: Build docker image manually

jobs:
  docker:
    name: Build docker image
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'GreptimeTeam' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Login to Dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to AliCloud Container Registry
        uses: docker/login-action@v2
        with:
          registry: greptime-registry.cn-hangzhou.cr.aliyuncs.com
          username: ${{ secrets.ALICLOUD_USERNAME }}
          password: ${{ secrets.ALICLOUD_PASSWORD }}

      - name: Configure image tag
        shell: bash
        run: |
          # Prefer the checked-out commit so the tag matches the built source.
          commitShortSHA=$(git rev-parse --short=8 HEAD)
          echo "IMAGE_TAG=${commitShortSHA}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        uses: docker/setup-buildx-action@v2

      - name: Send GitHub Action trigger data to Slack workflow
        id: slack_start
        uses: slackapi/slack-github-action@v1.23.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {"text": "Building OSS **dashboard** test image (no latest). git-ref: `${{ github.event.inputs.commit }}`"}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./docker/Dockerfile
          # Dockerfile default ARG command=docker → pnpm build:docker (OSS)
          push: true
          #platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: |
            greptime/greptimedb-dashboard:${{ env.IMAGE_TAG }}
            greptime-registry.cn-hangzhou.cr.aliyuncs.com/greptime/greptimedb-dashboard:${{ env.IMAGE_TAG }}

      - name: Send GitHub Action trigger data to Slack workflow
        id: slack_finish
        uses: slackapi/slack-github-action@v1.23.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {"text": "OSS **dashboard** test image is ready (no latest). Tag: `greptime/greptimedb-dashboard:${{ env.IMAGE_TAG }}`"}
